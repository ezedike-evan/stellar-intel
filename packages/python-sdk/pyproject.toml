[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stellarintel"
version = "1.3.0"
description = "Python client for the Stellar Intel public API -- rate comparison and off-ramp intent submission across Stellar anchors."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11, <4"
authors = [{ name = "Stellar Intel" }]
keywords = ["stellar", "stablecoin", "off-ramp", "remittance", "sep-38"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.23.1,<0.29.0", "attrs>=22.2.0"]

[project.urls]
Homepage = "https://stellar-intel.vercel.app"
Repository = "https://github.com/ezedike-evan/stellar-intel"
Issues = "https://github.com/ezedike-evan/stellar-intel/issues"
"API reference" = "https://stellar-intel.vercel.app/api/openapi.json"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-httpx>=0.30.0", "mypy>=1.10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stellarintel = ["py.typed"]

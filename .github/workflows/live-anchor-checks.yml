name: Live Anchor Checks

# Probes every registered anchor live — no snapshot, no mock.
#
# Designed to NEVER block a merge:
#   - runs on a schedule rather than per PR/push
#   - failure opens (or comments on) a tracking issue instead of failing the
#     merge queue
#   - CI's `npm run test` excludes the `live-anchors` vitest project so a
#     third-party anchor being down cannot red a PR that has nothing to do
#     with that anchor
#
# .github/workflows/data-health.yml was the model: same issue-per-day pattern.
# Related: #1034, #1032, #1033

on:
  schedule:
    # 06:47 UTC every 6 hours — staggered to avoid collisions with nightly (04:17)
    # and the hourly data-health runs.
    - cron: '47 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  NEXT_PUBLIC_STELLAR_NETWORK: mainnet
  NEXT_PUBLIC_HORIZON_URL: https://horizon.stellar.org
  NEXT_PUBLIC_USDC_ISSUER: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
  NEXT_PUBLIC_APP_NAME: Stellar Intel

jobs:
  live-anchor-probe:
    name: Live SEP-24 probe (all registered anchors)
    runs-on: ubuntu-latest
    outputs:
      degraded: ${{ steps.probe.outputs.degraded }}
      summary: ${{ steps.probe.outputs.summary }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # --dry-run: probe and report, but do NOT write constants/anchor-health.json.
      # The authoritative ledger write belongs to the `anchor-health-ledger` job in
      # nightly.yml which debounces on thresholdNights. Writing here would fight
      # that debounce (6×/day vs 1×/night).
      - name: Probe every registered anchor (SEP-1 TOML + SEP-24 endpoint)
        id: probe
        run: |
          set -euo pipefail
          node scripts/validate-anchors.mjs --dry-run | tee /tmp/live-anchor-probe.log
          DEGRADED=$(grep -c 'DEGRADED' /tmp/live-anchor-probe.log || true)
          echo "degraded=${DEGRADED:-0}" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<EOF"
            cat /tmp/live-anchor-probe.log
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Live anchor probe"
            echo ''
            echo '```'
            cat /tmp/live-anchor-probe.log
            echo '```'
            echo ''
            if [ "${DEGRADED:-0}" -gt 0 ]; then
              echo ":warning: **${DEGRADED} anchor(s) degraded** — see tracking issue."
            else
              echo ":white_check_mark: All probed anchors healthy."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs the `live-anchors` vitest project when it contains tagged tests.
  # Currently a no-op scaffold; see vitest.config.mts for how to tag a test
  # `{ tags: ['live-anchor'] }` and have it run here instead of in CI.
  live-anchor-vitest:
    name: Vitest live-anchors project
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      result: ${{ steps.run.outcome }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run live-anchor tagged tests
        id: run
        # `--project live-anchors` targets only the live-anchors vitest project.
        # If the project has no test files the command exits 0 (vitest skips empty
        # projects silently). When tests are present they run without the
        # `--mock-network` flag that CI uses.
        run: npm run test:live -- --reporter=default

  open-issue-on-failure:
    name: Open tracking issue on failure
    runs-on: ubuntu-latest
    needs: [live-anchor-probe, live-anchor-vitest]
    # Fire when either upstream job failed, or when the probe found degraded anchors.
    if: >
      failure() ||
      needs.live-anchor-probe.outputs.degraded != '0'
    steps:
      - uses: actions/github-script@v9
        env:
          PROBE_SUMMARY: ${{ needs.live-anchor-probe.outputs.summary }}
          PROBE_DEGRADED: ${{ needs.live-anchor-probe.outputs.degraded }}
          RESULT_PROBE: ${{ needs.live-anchor-probe.result }}
          RESULT_VITEST: ${{ needs.live-anchor-vitest.result }}
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const title = `[live-anchor] degradation detected — ${today}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const results = {
              'live-anchor-probe': process.env.RESULT_PROBE,
              'live-anchor-vitest': process.env.RESULT_VITEST,
            };
            const failed = Object.entries(results)
              .filter(([, r]) => r === 'failure')
              .map(([job]) => job);

            const body = [
              failed.length
                ? `Live-anchor check failed in ${failed.map((j) => '`' + j + '`').join(', ')}.`
                : `${process.env.PROBE_DEGRADED || '?'} anchor(s) reported as degraded.`,
              '',
              `- Workflow run: ${runUrl}`,
              '',
              '| Job | Result |',
              '| --- | --- |',
              ...Object.entries(results).map(([job, r]) => `| \`${job}\` | ${r} |`),
              '',
              'Live probe output:',
              '```',
              (process.env.PROBE_SUMMARY || '(no output captured)').trim(),
              '```',
              '',
              'This issue is opened by the scheduled live-anchor-checks workflow.',
              'A PR merge is **never** blocked by this check.',
            ].join('\n');

            // One issue per day; a second run on the same date comments instead of opening.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'anchor-degraded',
              per_page: 100,
            });
            const existing = open.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Commented on existing issue #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['anchor-degraded', 'module/ops'],
              });
              core.info(`Opened issue #${created.number}`);
            }

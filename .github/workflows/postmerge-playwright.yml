name: Post-merge Playwright

# Fork PRs never get preview-based browser checks (the deploy job in
# preview-deploy.yml requires the PR to come from this repository, which is a
# legitimate security boundary), so `main` can otherwise accumulate merges
# with zero browser verification. This workflow closes that gap by running
# the full Playwright suite against a locally built `next start` right after
# every push to `main`, independent of who opened the originating PR.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: postmerge-playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  # Without this the reputation store resolves to postgres (NODE_ENV is
  # production under `next start`) and every write returns 500 with
  # "DATABASE_URL is required for the postgres reputation backend", which is
  # what sank the scorecard-freshness case. CI must not write to the real
  # database, so it gets the non-durable backend that error prescribes.
  REPUTATION_BACKEND: sqlite
  NEXT_PUBLIC_STELLAR_NETWORK: mainnet
  NEXT_PUBLIC_HORIZON_URL: https://horizon.stellar.org
  NEXT_PUBLIC_STELLAR_EXPERT_URL: https://api.stellar.expert/explorer/public
  NEXT_PUBLIC_USDC_ISSUER: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
  NEXT_PUBLIC_APP_NAME: Stellar Intel

jobs:
  playwright:
    name: Playwright (main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          npm start &
          echo $! > /tmp/next-start.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 >/dev/null && break
            sleep 2
          done

      - name: Run Playwright suite
        id: playwright
        env:
          BASE_URL: http://localhost:3000
          PW_REUSE_SERVER: 'true'
        # `line` alone writes no playwright-report/, so the upload below found
        # nothing and every failing run lost its traces and screenshots.
        run: npx playwright test --reporter=line,html

      - name: Stop production server
        if: always()
        run: kill "$(cat /tmp/next-start.pid)" 2>/dev/null || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Open tracking issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const title = `[e2e] Playwright failed on main — ${today}`;

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'module/e2e',
            });
            if (existing.some((issue) => issue.title === title)) {
              console.log('Tracking issue for today already open; skipping.');
              return;
            }

            const body = [
              'The post-merge Playwright run failed against `main`.',
              '',
              `- Commit: ${context.sha}`,
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Download the `playwright-report` artifact from the run above for traces and screenshots.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['module/e2e', 'bug'],
            });

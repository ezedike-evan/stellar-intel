name: Publish Python SDK

# Publishes to PyPI on a python-sdk-v* tag, via PyPI's trusted publishing
# (OIDC) -- no API token stored in this repo. This will not work until a
# maintainer configures a trusted publisher for the `stellarintel` PyPI
# project pointing at this repo/workflow: https://docs.pypi.org/trusted-publishers/
on:
  push:
    tags: ['python-sdk-v*']

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/python-sdk

jobs:
  publish:
    name: build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python-sdk/dist

name: Publish Rust SDK

# Publishes stellar-intel-reputation to crates.io on a `stellar-intel-reputation-v*`
# tag. Tag-only on purpose: there is no manual trigger, so nothing can publish
# from an unreviewed branch, and the job runs in the `crates-io` environment so
# the registry token is only available behind that environment's protection
# rules.
on:
  push:
    tags:
      - 'stellar-intel-reputation-v*'

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/stellar-intel-reputation-v')
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      # The tag says what version is being published; Cargo.toml is the
      # authority. A mismatch means the tag was pushed against the wrong
      # commit, and publishing it would put a misleading version on crates.io.
      - name: Tag matches crate version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#stellar-intel-reputation-v}"
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 --manifest-path crates/stellar-intel-reputation/Cargo.toml | jq -r '.packages[0].version')
          if [ "$TAG_VERSION" != "$CRATE_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match stellar-intel-reputation version ${CRATE_VERSION}"
            exit 1
          fi

      - name: cargo test
        run: cargo test --manifest-path crates/stellar-intel-reputation/Cargo.toml --locked

      # Requires a CARGO_REGISTRY_TOKEN secret on the `crates-io` environment
      # (crates.io API token for an account with publish rights on
      # stellar-intel-reputation). Not set up yet — this job will fail until a
      # maintainer adds it.
      - name: cargo publish
        run: cargo publish --manifest-path crates/stellar-intel-reputation/Cargo.toml --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

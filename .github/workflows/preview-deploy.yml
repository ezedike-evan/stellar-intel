name: Preview Deploy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Vercel preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.vercel.outputs.preview-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@65.2.0

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=preview

      - name: Build with Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        if: env.VERCEL_TOKEN != ''
        run: vercel build

      - name: Deploy preview
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        if: env.VERCEL_TOKEN != ''
        run: |
          URL=$(vercel deploy --prebuilt)
          echo "preview-url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $URL"

      - name: Comment preview URL on PR
        if: github.event.pull_request.head.repo.full_name == github.repository && steps.vercel.outputs.preview-url != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = `${{ steps.vercel.outputs.preview-url }}`;
            const marker = '<!-- vercel-preview -->';
            const body = [
              marker,
              '## Preview deployment',
              '',
              `:rocket: **Preview URL**: ${url}`,
              '',
              `Commit: \`${context.sha.slice(0, 7)}\``,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const prior = comments.find((c) => c.body?.includes(marker));
            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.outputs.preview-url != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Smoke-test preview URL
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.preview-url }}
        # Runs the whole tests/e2e directory rather than naming one spec, so this
        # job can't silently drift out of date again the way it did when it named
        # tests/e2e/smoke.spec.ts — a vitest file, not a Playwright spec, which
        # made this job fail immediately with "Vitest cannot be imported in a
        # CommonJS module" every time it actually ran (#1028).
        run: npx playwright test --reporter=line

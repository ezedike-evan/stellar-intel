name: Secret Scan

# A committed secret is the one class of mistake a follow-up commit cannot fix:
# once it is in the history it is disclosed, and the only real remedy is to
# rotate the credential. This workflow exists so that never has to be found out
# after the fact (#1148).
#
# Two jobs, because they answer different questions:
#   - `pull-request` scans only the commits a PR adds. It is the gate — fast
#     enough to run on every PR, and it fails before the secret can land.
#   - `full-history` scans every commit on a weekly schedule. The gate cannot
#     see what predates it, and a scan that only ever looks forward would
#     declare the repository clean without ever having checked.
#
# Both use the same committed `.gitleaks.toml`, so a local run reproduces CI:
#
#   gitleaks git --config .gitleaks.toml     # full history
#   gitleaks dir --config .gitleaks.toml     # working tree

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]
  schedule:
    # 05:23 UTC Mondays — off-peak, and clear of nightly (04:17) and CodeQL
    # (03:00 Mondays) so a slow full-history scan never queues behind them.
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned by version AND checksum. An unpinned installer would let whoever
  # controls the release channel run arbitrary code in a job that reads the
  # whole repository history — precisely the thing this workflow is defending.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  pull-request:
    name: Scan PR commits
    # `push` to main is covered by the same diff scan: the range is then the
    # commits the push added.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The scan compares two commits, so both must be present. Actions'
          # default single-commit checkout would leave nothing to diff against.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Determine commit range
        id: range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # A branch's first push reports an all-zero "before" commit, which is
          # not a revision anything can be diffed against. Fall back to the
          # single head commit rather than failing the job on a new branch.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "range=${head}~1..${head}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${base}..${head}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan added commits
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --log-opts "${{ steps.range.outputs.range }}" \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      # Only on failure: the report is the evidence for triage, and uploading a
      # report that says "nothing found" on every green run is noise.
      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: gitleaks-pr-findings
          path: gitleaks.sarif
          retention-days: 14

      - name: Explain a failure
        if: failure()
        run: |
          {
            echo "### Secret scan failed"
            echo
            echo "gitleaks matched a potential secret in the commits this change adds."
            echo
            echo "**If it is a real secret:** rotate it first. Removing the commit does not"
            echo "un-disclose a value that has already been pushed."
            echo
            echo "**If it is a false positive:** add a justified entry to \`.gitleaks.toml\`"
            echo "(allowlist) or \`.gitleaksignore\` (fingerprint), and say in the PR why the"
            echo "value is safe to publish."
            echo
            echo "Reproduce locally: \`gitleaks git --config .gitleaks.toml\`"
          } >> "$GITHUB_STEP_SUMMARY"

  full-history:
    name: Scan full history
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan every commit
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: gitleaks-history-findings
          path: gitleaks.sarif
          retention-days: 30

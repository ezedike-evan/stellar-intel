name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          # stellar-xdr's StringM::from_str max-length validation bypass
          # (moderate). Pinned transitively by soroban-sdk = "22.0.0" —
          # the same version contracts/reputation and examples/consumer-contract
          # already depend on — via soroban-sdk-macros' exact "=22.1.0" pin on
          # stellar-xdr. No 22.x release of soroban-sdk fixes it; the fix only
          # landed in a much later major line, and bumping there needs
          # protocol/XDR compatibility verification against the deployed
          # testnet contract before it's safe, which is out of scope here.
          # Revisit once that bump is planned.
          allow-ghsas: GHSA-x57h-xx53-v53w

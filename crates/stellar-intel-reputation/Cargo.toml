[package]
name = "stellar-intel-reputation"
version = "0.3.0"
edition = "2021"
description = "Thin Soroban read SDK for the Stellar Intel reputation oracle — on-chain reads, no API round trip"
license = "MIT"
repository = "https://github.com/ezedike-evan/stellar-intel"
homepage = "https://stellar-intel.vercel.app"
documentation = "https://docs.rs/stellar-intel-reputation"
readme = "README.md"
keywords = ["stellar", "soroban", "oracle", "reputation"]
categories = ["finance", "no-std"]
publish = true

[lib]
name = "stellar_intel_reputation"
path = "src/lib.rs"
doctest = false

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
